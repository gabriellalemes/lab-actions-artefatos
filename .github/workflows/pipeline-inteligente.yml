name: Pipeline Inteligente

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - '!src/docs/**'

jobs:
  job_gerador:
    runs-on: ubuntu-latest
    steps:
      - name: Simular construcao do projeto
        run: |
          mkdir -p saida_build
          echo "Relatorio 1 - Gerado em $(date)" > saida_build/relatorio1.txt
          echo "Relatorio de testes - Conteudo do relatorio2" > saida_build/relatorio2.txt
      - name: Upload de artefatos
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  job_auditoria:
    runs-on: ubuntu-latest
    needs: job_gerador
    steps:
      - name: Download de artefatos
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: relatorios-baixados
      - name: Verificar conteudo
        run: |
          echo "=== Listando arquivos ==="
          ls -R relatorios-baixados
          echo "=== Conteudo do relatorio1.txt ==="
          cat relatorios-baixados/relatorio1.txt